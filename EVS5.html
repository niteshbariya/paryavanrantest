// ==========================================
// સિસ્ટમ લોજિક
// ==========================================
let currentQ = 0;
let userAnswers = new Array(questions.length).fill(null);
let startTime, timerInterval, studentName, studentPhone;

function startQuiz() {
    studentName = document.getElementById("name").value.trim();
    studentPhone = document.getElementById("phone").value.trim();
    if (!studentName || studentPhone.length < 10) {
        alert("કૃપા કરીને પૂરું નામ અને સાચો ૧૦ અંકનો મોબાઇલ નંબર દાખલ કરો.");
        return;
    }
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("quizScreen").style.display = "block";
    startTime = new Date();
    timerInterval = setInterval(updateTimer, 1000);
    loadQuestion();
}

function updateTimer() {
    const elapsed = Math.floor((new Date() - startTime) / 1000);
    const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const secs = String(elapsed % 60).padStart(2, '0');
    document.getElementById("timerDisplay").innerText = `${mins}:${secs}`;
}

function loadQuestion() {
    const q = questions[currentQ];
    document.getElementById("qProgress").innerText = `પ્રશ્ન ${currentQ + 1} / ${questions.length}`;
    document.getElementById("questionText").innerText = q.q;
    const optContainer = document.getElementById("optionsContainer");
    optContainer.innerHTML = "";

    q.options.forEach((opt, idx) => {
        const label = document.createElement("label");
        label.className = "option-label";
        const isChecked = userAnswers[currentQ] === idx ? "checked" : "";
        label.innerHTML = `<input type="radio" name="opt" value="${idx}" ${isChecked} onchange="saveAnswer(${idx})"> ${opt}`;
        optContainer.appendChild(label);
    });

    document.getElementById("prevBtn").style.visibility = (currentQ === 0) ? "hidden" : "visible";
    document.getElementById("nextBtn").innerText = (currentQ === questions.length - 1) ? "ટેસ્ટ સબમિટ કરો" : "આગળ";
}

function saveAnswer(idx) {
    userAnswers[currentQ] = idx;
}

function prevQuestion() {
    if (currentQ > 0) { currentQ--; loadQuestion(); }
}

function nextQuestion() {
    if (currentQ < questions.length - 1) {
        currentQ++;
        loadQuestion();
    } else {
        submitQuiz();
    }
}

function submitQuiz() {
    clearInterval(timerInterval);
    const elapsed = Math.floor((new Date() - startTime) / 1000);
    const formattedTime = `${Math.floor(elapsed / 60)} મિનિટ ${elapsed % 60} સેકન્ડ`;

    let score = 0;
    questions.forEach((q, i) => { if (userAnswers[i] === q.ans) score++; });
    const percent = ((score / questions.length) * 100).toFixed(2);

    document.getElementById("quizScreen").style.display = "none";
    document.getElementById("resultScreen").style.display = "block";
    document.getElementById("resName").innerText = studentName;
    document.getElementById("resPhone").innerText = studentPhone;
    document.getElementById("resTime").innerText = formattedTime;
    document.getElementById("resScore").innerText = `${score} / ${questions.length}`;
    document.getElementById("resPercent").innerText = `${percent}%`;

    const revBox = document.getElementById("reviewContainer");
    revBox.innerHTML = "";
    questions.forEach((q, i) => {
        const isCorrect = (userAnswers[i] === q.ans);
        const item = document.createElement("div");
        item.className = "review-item " + (isCorrect ? "is-correct" : "is-wrong");
        item.innerHTML = `
            <p style="font-weight:600; margin:0 0 8px 0;">${q.q}</p>
            <p style="margin:4px 0; color: ${isCorrect ? '#22543d' : '#742a2a'};">
                <strong>તમારો ઉત્તર:</strong> ${userAnswers[i] !== null ? q.options[userAnswers[i]] : "જવાબ આપ્યો નથી"} ${isCorrect ? '✅' : '❌'}
            </p>
            ${!isCorrect ? `<p style="margin:4px 0; color:#22543d;"><strong>સાચો ઉત્તર:</strong> ${q.options[q.ans]}</p>` : ''}
            <div class="exp-box"><strong>સમજૂતી:</strong> ${q.exp}</div>
        `;
        revBox.appendChild(item);
    });

    const testData = {
        dateTime: new Date().toLocaleString('gu-IN', { timeZone: 'Asia/Kolkata' }),
        name: studentName,
        phone: studentPhone,
        subject: "ધોરણ-૫ પર્યાવરણ (૧૫૫ પ્રશ્નો)",
        timeTaken: formattedTime,
        score: `${score} / ${questions.length}`,
        percentage: `${percent}%`
    };

    fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(testData)
    });
}
